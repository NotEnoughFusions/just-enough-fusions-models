name: Check model submission

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write

concurrency:
  group: models-repo
  cancel-in-progress: false

jobs:
  check:
    if: contains(github.event.issue.labels.*.name, 'submission') && github.event.issue.state == 'open'
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the model
        id: check
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          REPO_OWNER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/process_submission.py

      - name: Save the model
        if: steps.check.outputs.ok == 'true'
        env:
          MODEL_ID: ${{ steps.check.outputs.model_id }}
        run: |
          git config user.name "jef-models-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models trusted.txt
          git commit -m "Add model $MODEL_ID"
          git pull --rebase
          git push

      - name: Reply on the issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          OK: ${{ steps.check.outputs.ok }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body-file result.md
          if [ "$OK" = "true" ]; then
            gh issue edit "$ISSUE_NUMBER" --add-label accepted --remove-label needs-fix || true
            gh issue close "$ISSUE_NUMBER"
          else
            gh issue edit "$ISSUE_NUMBER" --add-label needs-fix || true
          fi

  publish:
    needs: check
    if: needs.check.outputs.ok == 'true'
    uses: ./.github/workflows/publish.yml
